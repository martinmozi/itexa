<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-size="17">

  <style>
    .bg   { fill: #ffffff; }
    .txt  { fill: #1f2937; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .muted{ fill: #6b7280; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
    .wcol { stroke: #2563eb; }   /* váhy - modrá */
    .wtxt { fill: #2563eb; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; }
    .bcol { stroke: #d97706; stroke-width: 2; }   /* bias - oranžová */
    .btxt { fill: #d97706; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; }
    .acol { stroke: #059669; }   /* aktivácia - zelená */
    .atxt { fill: #059669; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; }
    .edge { stroke: #93c5fd; stroke-width: 1.4; fill: none; opacity: 0.7; }
    .pill { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
    .badge{ fill: #ffffff; stroke: #d97706; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .txt  { fill: #e6edf3; }
      .muted{ fill: #9ca3af; }
      .node { fill: #16233b; stroke: #60a5fa; }
      .wcol { stroke: #60a5fa; }
      .wtxt { fill: #93c5fd; }
      .bcol { stroke: #fbbf24; }
      .btxt { fill: #fbbf24; }
      .acol { stroke: #34d399; }
      .atxt { fill: #6ee7b7; }
      .edge { stroke: #2b4a6f; }
      .pill { fill: #0d1117; stroke: #60a5fa; }
      .badge{ fill: #0d1117; stroke: #fbbf24; }
    }
  </style>

  <defs>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="610" rx="10"/>

  <!-- ===== hrany: vstup -> skrytá (matica W1) ===== -->
  <line class="edge" x1="170" y1="170" x2="410" y2="110"/>
  <line class="edge" x1="170" y1="170" x2="410" y2="210"/>
  <line class="edge" x1="170" y1="170" x2="410" y2="310"/>
  <line class="edge" x1="170" y1="170" x2="410" y2="410"/>
  <line class="edge" x1="170" y1="280" x2="410" y2="110"/>
  <line class="edge" x1="170" y1="280" x2="410" y2="210"/>
  <line class="edge" x1="170" y1="280" x2="410" y2="310"/>
  <line class="edge" x1="170" y1="280" x2="410" y2="410"/>
  <line class="edge" x1="170" y1="390" x2="410" y2="110"/>
  <line class="edge" x1="170" y1="390" x2="410" y2="210"/>
  <line class="edge" x1="170" y1="390" x2="410" y2="310"/>
  <line class="edge" x1="170" y1="390" x2="410" y2="410"/>

  <!-- ===== hrany: skrytá -> výstup (matica W2) ===== -->
  <line class="edge" x1="470" y1="110" x2="710" y2="220"/>
  <line class="edge" x1="470" y1="110" x2="710" y2="340"/>
  <line class="edge" x1="470" y1="210" x2="710" y2="220"/>
  <line class="edge" x1="470" y1="210" x2="710" y2="340"/>
  <line class="edge" x1="470" y1="310" x2="710" y2="220"/>
  <line class="edge" x1="470" y1="310" x2="710" y2="340"/>
  <line class="edge" x1="470" y1="410" x2="710" y2="220"/>
  <line class="edge" x1="470" y1="410" x2="710" y2="340"/>

  <!-- zvýraznená jedna hrana = jedna váha -->
  <line class="wcol" stroke-width="3.5" x1="170" y1="170" x2="410" y2="210"/>
  <text class="wtxt" x="268" y="176" text-anchor="middle" font-size="15">w<tspan font-size="11" dy="3">12</tspan></text>

  <!-- ===== neuróny ===== -->
  <circle class="node" cx="140" cy="170" r="30"/>
  <text class="txt" x="140" y="176" text-anchor="middle">x<tspan font-size="12" dy="4">1</tspan></text>
  <circle class="node" cx="140" cy="280" r="30"/>
  <text class="txt" x="140" y="286" text-anchor="middle">x<tspan font-size="12" dy="4">2</tspan></text>
  <circle class="node" cx="140" cy="390" r="30"/>
  <text class="txt" x="140" y="396" text-anchor="middle">x<tspan font-size="12" dy="4">3</tspan></text>

  <circle class="node" cx="440" cy="110" r="30"/>
  <text class="atxt" x="440" y="117" text-anchor="middle" font-size="20">σ</text>
  <circle class="node" cx="440" cy="210" r="30"/>
  <text class="atxt" x="440" y="217" text-anchor="middle" font-size="20">σ</text>
  <circle class="node" cx="440" cy="310" r="30"/>
  <text class="atxt" x="440" y="317" text-anchor="middle" font-size="20">σ</text>
  <circle class="node" cx="440" cy="410" r="30"/>
  <text class="atxt" x="440" y="417" text-anchor="middle" font-size="20">σ</text>

  <circle class="node" cx="740" cy="220" r="30"/>
  <text class="atxt" x="740" y="227" text-anchor="middle" font-size="20">σ</text>
  <circle class="node" cx="740" cy="340" r="30"/>
  <text class="atxt" x="740" y="347" text-anchor="middle" font-size="20">σ</text>

  <!-- ===== biasy: jeden na každý neurón skrytej vrstvy (vektor b1) ===== -->
  <line class="bcol" x1="486" y1="110" x2="474" y2="110" marker-end="url(#arwB)"/>
  <rect class="badge" x="486" y="99" width="46" height="22" rx="7"/>
  <text class="btxt" x="509" y="115" text-anchor="middle" font-size="14">b<tspan font-size="10" dy="3">1,1</tspan></text>

  <line class="bcol" x1="486" y1="210" x2="474" y2="210" marker-end="url(#arwB)"/>
  <rect class="badge" x="486" y="199" width="46" height="22" rx="7"/>
  <text class="btxt" x="509" y="215" text-anchor="middle" font-size="14">b<tspan font-size="10" dy="3">1,2</tspan></text>

  <line class="bcol" x1="486" y1="310" x2="474" y2="310" marker-end="url(#arwB)"/>
  <rect class="badge" x="486" y="299" width="46" height="22" rx="7"/>
  <text class="btxt" x="509" y="315" text-anchor="middle" font-size="14">b<tspan font-size="10" dy="3">1,3</tspan></text>

  <line class="bcol" x1="486" y1="410" x2="474" y2="410" marker-end="url(#arwB)"/>
  <rect class="badge" x="486" y="399" width="46" height="22" rx="7"/>
  <text class="btxt" x="509" y="415" text-anchor="middle" font-size="14">b<tspan font-size="10" dy="3">1,4</tspan></text>

  <!-- ===== biasy výstupnej vrstvy (vektor b2) ===== -->
  <line class="bcol" x1="786" y1="220" x2="774" y2="220" marker-end="url(#arwB)"/>
  <rect class="badge" x="786" y="209" width="46" height="22" rx="7"/>
  <text class="btxt" x="809" y="225" text-anchor="middle" font-size="14">b<tspan font-size="10" dy="3">2,1</tspan></text>

  <line class="bcol" x1="786" y1="340" x2="774" y2="340" marker-end="url(#arwB)"/>
  <rect class="badge" x="786" y="329" width="46" height="22" rx="7"/>
  <text class="btxt" x="809" y="345" text-anchor="middle" font-size="14">b<tspan font-size="10" dy="3">2,2</tspan></text>

  <!-- ===== popisy váhových matíc priamo na zväzku hrán ===== -->
  <rect class="pill" x="222" y="238" width="138" height="66" rx="10"/>
  <text class="wtxt" x="291" y="259" text-anchor="middle" font-size="17">W<tspan font-size="12" dy="4">1</tspan></text>
  <text class="muted" x="291" y="279" text-anchor="middle" font-size="12">3 × 4 = 12 váh</text>
  <text class="muted" x="291" y="296" text-anchor="middle" font-size="12">(vstupy × neuróny)</text>

  <rect class="pill" x="531" y="238" width="138" height="66" rx="10"/>
  <text class="wtxt" x="600" y="259" text-anchor="middle" font-size="17">W<tspan font-size="12" dy="4">2</tspan></text>
  <text class="muted" x="600" y="279" text-anchor="middle" font-size="12">4 × 2 = 8 váh</text>
  <text class="muted" x="600" y="296" text-anchor="middle" font-size="12">(neuróny × výstupy)</text>

  <!-- ===== nadpisy vrstiev ===== -->
  <text class="muted" x="140" y="60" text-anchor="middle" font-size="16">Vstupná vrstva</text>
  <text class="muted" x="440" y="60" text-anchor="middle" font-size="16">Skrytá vrstva</text>
  <text class="muted" x="740" y="60" text-anchor="middle" font-size="16">Výstupná vrstva</text>

  <!-- ===== zhrnutie pod vrstvami ===== -->
  <text class="btxt" x="440" y="478" text-anchor="middle" font-size="14">vektor b<tspan font-size="10" dy="3">1</tspan><tspan font-size="14" dy="-3"> = 4 čísla (1 na neurón)</tspan></text>
  <text class="btxt" x="740" y="478" text-anchor="middle" font-size="14">vektor b<tspan font-size="10" dy="3">2</tspan><tspan font-size="14" dy="-3"> = 2 čísla</tspan></text>

  <!-- ===== legenda ===== -->
  <line class="edge" x1="40" y1="512" x2="860" y2="512" stroke-width="1"/>

  <circle cx="52" cy="540" r="7" class="node"/>
  <text class="muted" x="66" y="545" font-size="14">neurón</text>

  <line class="wcol" stroke-width="3.5" x1="160" y1="540" x2="196" y2="540"/>
  <text class="wtxt" x="206" y="545" font-size="14">w<tspan font-size="10" dy="3">ij</tspan><tspan font-size="14" dy="-3"> = jedna váha (jedna hrana)</tspan></text>

  <rect class="pill" x="490" y="529" width="26" height="22" rx="7"/>
  <text class="wtxt" x="526" y="545" font-size="14">W = celá matica váh medzi dvoma vrstvami</text>

  <rect class="badge" x="160" y="567" width="36" height="22" rx="7"/>
  <line class="bcol" x1="156" y1="578" x2="146" y2="578" marker-end="url(#arwB)"/>
  <text class="btxt" x="206" y="583" font-size="14">b = bias, jeden pre každý neurón vrstvy</text>

  <text class="atxt" x="560" y="583" font-size="14">σ = aktivačná funkcia (nie je učený parameter)</text>
</svg>
