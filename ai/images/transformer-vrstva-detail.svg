<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1000" font-size="14">
  <style>
    .bg{ fill:#ffffff; }
    .txt{ fill:#1f2937; font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .muted{ fill:#6b7280; font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .tok{ fill:#dcfce7; stroke:#059669; stroke-width:2; }
    .tokt{ fill:#065f46; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; }
    .q{ fill:#fee2e2; stroke:#dc2626; stroke-width:1.8; }
    .qt{ fill:#991b1b; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:700; }
    .k{ fill:#fef3c7; stroke:#d97706; stroke-width:1.8; }
    .kt{ fill:#92400e; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:700; }
    .v{ fill:#eff6ff; stroke:#3b82f6; stroke-width:1.8; }
    .vt{ fill:#1e3a8a; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:700; }
    .op{ fill:#ede9fe; stroke:#7c3aed; stroke-width:2; }
    .opt{ fill:#5b21b6; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; }
    .nrm{ fill:#f1f5f9; stroke:#64748b; stroke-width:1.6; }
    .nrmt{ fill:#334155; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; }
    .ffn{ fill:#fdf2f8; stroke:#db2777; stroke-width:2; }
    .ffnt{ fill:#9d174d; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; }
    .mix{ fill:#eff6ff; stroke:#3b82f6; stroke-width:1.6; }
    .panel{ fill:none; stroke:#9ca3af; stroke-width:1.6; stroke-dasharray:7 5; }
    .cell{ fill:#3b82f6; }
    .cellb{ stroke:#93c5fd; stroke-width:1; fill:none; }
    .mask{ fill:#e5e7eb; }
    .arr{ stroke:#6b7280; stroke-width:1.8; fill:none; }
    .cross{ stroke:#dc2626; stroke-width:2.2; }
    .sep{ stroke:#9ca3af; stroke-width:1.2; stroke-dasharray:4 5; }
    @media (prefers-color-scheme: dark){
      .bg{ fill:#0d1117; } .txt{ fill:#e6edf3; } .muted{ fill:#9ca3af; }
      .tok{ fill:#0f2e1e; stroke:#34d399; } .tokt{ fill:#6ee7b7; }
      .q{ fill:#3a1414; stroke:#f87171; } .qt{ fill:#fca5a5; }
      .k{ fill:#3a2a0d; stroke:#fbbf24; } .kt{ fill:#fbbf24; }
      .v{ fill:#16233b; stroke:#60a5fa; } .vt{ fill:#93c5fd; }
      .op{ fill:#231447; stroke:#a78bfa; } .opt{ fill:#c4b5fd; }
      .nrm{ fill:#1c2128; stroke:#8b949e; } .nrmt{ fill:#c9d1d9; }
      .ffn{ fill:#3b0d29; stroke:#f472b6; } .ffnt{ fill:#f9a8d4; }
      .mix{ fill:#16233b; stroke:#60a5fa; }
      .panel{ stroke:#6b7280; } .arr{ stroke:#9ca3af; } .sep{ stroke:#6b7280; }
      .mask{ fill:#30363d; } .cellb{ stroke:#1e3a8a; } .cross{ stroke:#f87171; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="1000" rx="10"/>

  <text class="txt" x="470" y="34" text-anchor="middle" font-size="17" font-weight="700">Jedna vrstva transformera zblízka (pre-norm, ako dnešné modely)</text>
  <text class="muted" x="470" y="56" text-anchor="middle" font-size="13">attention mieša informáciu MEDZI tokenmi · feed-forward spracúva KAŽDÝ token zvlášť</text>
  <text class="muted" x="470" y="78" text-anchor="middle" font-size="12.5">každý stĺpec = jeden token; jeho vektor má 4096 čísel a túto dĺžku si drží celou vrstvou</text>

  <!-- ============ vstup ============ -->
  <text class="muted" x="60" y="92" font-size="12">vstup vrstvy  X [3 × 4096]</text>
  <rect class="tok" x="125" y="100" width="150" height="40" rx="6"/><text class="tokt" x="200" y="125" text-anchor="middle">„nárok"</text>
  <rect class="tok" x="365" y="100" width="150" height="40" rx="6"/><text class="tokt" x="440" y="125" text-anchor="middle">„na"</text>
  <rect class="tok" x="605" y="100" width="150" height="40" rx="6"/><text class="tokt" x="680" y="125" text-anchor="middle">„dovolenku"</text>

  <path class="arr" d="M200,140 L200,176" marker-end="url(#a)"/>
  <path class="arr" d="M440,140 L440,176" marker-end="url(#a)"/>
  <path class="arr" d="M680,140 L680,176" marker-end="url(#a)"/>

  <!-- ============ 1. ATTENTION ============ -->
  <rect class="panel" x="40" y="178" width="860" height="422" rx="12"/>
  <text class="opt" x="60" y="202" font-size="14.5" font-weight="700">1 · ATTENTION — jediné miesto, kde si tokeny vymieňajú informáciu</text>

  <rect class="nrm" x="125" y="214" width="630" height="26" rx="6"/>
  <text class="nrmt" x="440" y="232" text-anchor="middle" font-size="12.5">RMSNorm (per token) — pri pre-norme sa normalizuje PRED attention</text>

  <text class="muted" x="205" y="264" font-size="12.5">z každého vektora vzniknú tri projekcie:  Q = x·W<tspan dy="4" font-size="9">Q</tspan><tspan dy="-4">,   K = x·W</tspan><tspan dy="4" font-size="9">K</tspan><tspan dy="-4">,   V = x·W</tspan><tspan dy="4" font-size="9">V</tspan></text>

  <g font-size="12" text-anchor="middle">
    <rect class="q" x="128" y="274" width="44" height="28" rx="5"/><text class="qt" x="150" y="293">Q</text>
    <rect class="k" x="178" y="274" width="44" height="28" rx="5"/><text class="kt" x="200" y="293">K</text>
    <rect class="v" x="228" y="274" width="44" height="28" rx="5"/><text class="vt" x="250" y="293">V</text>

    <rect class="q" x="368" y="274" width="44" height="28" rx="5"/><text class="qt" x="390" y="293">Q</text>
    <rect class="k" x="418" y="274" width="44" height="28" rx="5"/><text class="kt" x="440" y="293">K</text>
    <rect class="v" x="468" y="274" width="44" height="28" rx="5"/><text class="vt" x="490" y="293">V</text>

    <rect class="q" x="608" y="274" width="44" height="28" rx="5"/><text class="qt" x="630" y="293">Q</text>
    <rect class="k" x="658" y="274" width="44" height="28" rx="5"/><text class="kt" x="680" y="293">K</text>
    <rect class="v" x="708" y="274" width="44" height="28" rx="5"/><text class="vt" x="730" y="293">V</text>
  </g>
  <text class="muted" x="790" y="288" font-size="11">každý po 128 čísel</text>
  <text class="muted" x="790" y="303" font-size="11">na jednu hlavu</text>

  <!-- zvod vsetkych Q/K/V do vypoctu -->
  <path class="arr" d="M150,302 L150,326" fill="none"/>
  <path class="arr" d="M440,302 L440,326" fill="none"/>
  <path class="arr" d="M680,302 L680,326" fill="none"/>
  <path class="arr" d="M150,326 L680,326" fill="none"/>
  <path class="arr" d="M188,326 L188,348" marker-end="url(#a)"/>

  <!-- matica vah -->
  <text class="txt" x="188" y="364" text-anchor="middle" font-size="12.5" font-weight="700">attention váhy α  [3 × 3]</text>
  <g font-size="10.5" class="muted" text-anchor="middle">
    <text x="136" y="382">nárok</text><text x="188" y="382">na</text><text x="240" y="382">dovol.</text>
  </g>
  <g font-size="11.5">
    <rect class="cell" x="110" y="388" width="52" height="52" opacity="0.85"/><text x="136" y="419" text-anchor="middle" fill="#ffffff">1.00</text>
    <rect class="mask" x="162" y="388" width="52" height="52"/><text class="muted" x="188" y="419" text-anchor="middle">−∞</text>
    <rect class="mask" x="214" y="388" width="52" height="52"/><text class="muted" x="240" y="419" text-anchor="middle">−∞</text>

    <rect class="cell" x="110" y="440" width="52" height="52" opacity="0.55"/><text class="txt" x="136" y="471" text-anchor="middle">0.62</text>
    <rect class="cell" x="162" y="440" width="52" height="52" opacity="0.32"/><text class="txt" x="188" y="471" text-anchor="middle">0.38</text>
    <rect class="mask" x="214" y="440" width="52" height="52"/><text class="muted" x="240" y="471" text-anchor="middle">−∞</text>

    <rect class="cell" x="110" y="492" width="52" height="52" opacity="0.20"/><text class="txt" x="136" y="523" text-anchor="middle">0.21</text>
    <rect class="cell" x="162" y="492" width="52" height="52" opacity="0.13"/><text class="txt" x="188" y="523" text-anchor="middle">0.14</text>
    <rect class="cell" x="214" y="492" width="52" height="52" opacity="0.60"/><text class="txt" x="240" y="523" text-anchor="middle">0.65</text>
  </g>
  <rect class="cellb" x="110" y="388" width="156" height="156"/>
  <g class="muted" font-size="10.5" text-anchor="end">
    <text x="106" y="419">nárok</text><text x="106" y="471">na</text><text x="106" y="523">dovolenku</text>
  </g>
  <text class="muted" x="188" y="561" text-anchor="middle" font-size="11">riadok = kto sa pýta, stĺpec = koho sa pýta</text>

  <!-- vysvetlenie vpravo -->
  <g font-size="13">
    <text class="txt" x="300" y="370" font-weight="700">ako to prebehne</text>
    <text class="txt" x="300" y="398">1. score(i,j) = Q<tspan dy="4" font-size="9">i</tspan><tspan dy="-4"> · K</tspan><tspan dy="4" font-size="9">j</tspan><tspan dy="-4"> / √d</tspan><tspan dy="4" font-size="9">head</tspan><tspan dy="-4">   — každý s každým</tspan></text>
    <text class="txt" x="300" y="424">2. kauzálna maska: všetko napravo od i dostane −∞</text>
    <text class="txt" x="300" y="450">3. softmax po riadkoch → váhy so súčtom 1</text>
    <text class="txt" x="300" y="476">4. výstup<tspan dy="4" font-size="9">i</tspan><tspan dy="-4"> = Σ</tspan><tspan dy="4" font-size="9">j</tspan><tspan dy="-4"> α</tspan><tspan dy="4" font-size="9">ij</tspan><tspan dy="-4"> · V</tspan><tspan dy="4" font-size="9">j</tspan><tspan dy="-4">   — vážená zmes hodnôt</tspan></text>
  </g>
  <g class="muted" font-size="11.5">
    <text x="300" y="508">matica má n² prvkov → 2× dlhší kontext = 4× viac práce</text>
    <text x="300" y="528">K a V starých tokenov sa už nezmenia → KV cache</text>
    <text x="300" y="548">Q sa cachovať nedá — nový token kladie novú otázku</text>
  </g>

  <!-- zmiesanie: konkretny vystup -->
  <rect class="mix" x="60" y="570" width="820" height="26" rx="6"/>
  <text class="txt" x="110" y="588" font-size="12.5">výstup pre „dovolenku" = 0.21 · V<tspan dy="4" font-size="9">nárok</tspan><tspan dy="-4"> + 0.14 · V</tspan><tspan dy="4" font-size="9">na</tspan><tspan dy="-4"> + 0.65 · V</tspan><tspan dy="4" font-size="9">dovolenku</tspan><tspan dy="-4">   →  vektor je teraz zmesou VŠETKÝCH tokenov</tspan></text>

  <path class="arr" d="M200,600 L200,624" marker-end="url(#a)"/>
  <path class="arr" d="M440,600 L440,624" marker-end="url(#a)"/>
  <path class="arr" d="M680,600 L680,624" marker-end="url(#a)"/>

  <!-- Add 1 -->
  <rect class="op" x="125" y="626" width="630" height="34" rx="7"/>
  <text class="opt" x="440" y="648" text-anchor="middle" font-size="13">Add (reziduum):  x = x + attention(RMSNorm(x))  — pôvodný vstup sa pripočíta späť</text>
  <path class="arr" d="M200,660 L200,682" marker-end="url(#a)"/>
  <path class="arr" d="M440,660 L440,682" marker-end="url(#a)"/>
  <path class="arr" d="M680,660 L680,682" marker-end="url(#a)"/>

  <!-- ============ 2. FEED-FORWARD ============ -->
  <rect class="panel" x="40" y="684" width="860" height="238" rx="12"/>
  <text class="ffnt" x="60" y="708" font-size="14.5" font-weight="700">2 · FEED-FORWARD — každý token prejde sám za seba, tými istými váhami</text>

  <rect class="nrm" x="125" y="718" width="630" height="24" rx="6"/>
  <text class="nrmt" x="440" y="735" text-anchor="middle" font-size="12">RMSNorm (per token) — opäť pred blokom, nie po ňom</text>

  <text class="txt" x="232" y="764" font-size="13">FFN(x) = W<tspan dy="4" font-size="9">down</tspan><tspan dy="-4"> · ( SiLU(W</tspan><tspan dy="4" font-size="9">gate</tspan><tspan dy="-4">·x)  ×  (W</tspan><tspan dy="4" font-size="9">up</tspan><tspan dy="-4">·x) )   — násobenie po zložkách</tspan></text>
  <text class="muted" x="470" y="786" text-anchor="middle" font-size="12">tie isté matice W pre všetky tokeny · medzi stĺpcami netečie nič · ~70 % parametrov modelu (80 % v rámci vrstvy)</text>

  <line class="sep" x1="320" y1="794" x2="320" y2="918"/>
  <line class="sep" x1="560" y1="794" x2="560" y2="918"/>
  <g class="cross">
    <line x1="313" y1="849" x2="327" y2="863"/><line x1="327" y1="849" x2="313" y2="863"/>
    <line x1="553" y1="849" x2="567" y2="863"/><line x1="567" y1="849" x2="553" y2="863"/>
  </g>

  <g text-anchor="middle" font-size="12">
    <rect class="ffn" x="140" y="800" width="120" height="26" rx="5"/><text class="ffnt" x="200" y="818">4096</text>
    <path class="arr" d="M200,826 L200,840" marker-end="url(#a)"/>
    <rect class="ffn" x="110" y="840" width="180" height="34" rx="5"/><text class="ffnt" x="200" y="862">14336 · SiLU</text>
    <path class="arr" d="M200,874 L200,888" marker-end="url(#a)"/>
    <rect class="ffn" x="140" y="888" width="120" height="26" rx="5"/><text class="ffnt" x="200" y="906">4096</text>

    <rect class="ffn" x="380" y="800" width="120" height="26" rx="5"/><text class="ffnt" x="440" y="818">4096</text>
    <path class="arr" d="M440,826 L440,840" marker-end="url(#a)"/>
    <rect class="ffn" x="350" y="840" width="180" height="34" rx="5"/><text class="ffnt" x="440" y="862">14336 · SiLU</text>
    <path class="arr" d="M440,874 L440,888" marker-end="url(#a)"/>
    <rect class="ffn" x="380" y="888" width="120" height="26" rx="5"/><text class="ffnt" x="440" y="906">4096</text>

    <rect class="ffn" x="620" y="800" width="120" height="26" rx="5"/><text class="ffnt" x="680" y="818">4096</text>
    <path class="arr" d="M680,826 L680,840" marker-end="url(#a)"/>
    <rect class="ffn" x="590" y="840" width="180" height="34" rx="5"/><text class="ffnt" x="680" y="862">14336 · SiLU</text>
    <path class="arr" d="M680,874 L680,888" marker-end="url(#a)"/>
    <rect class="ffn" x="620" y="888" width="120" height="26" rx="5"/><text class="ffnt" x="680" y="906">4096</text>
  </g>
  <text class="muted" x="790" y="818" font-size="11">rozšír</text>
  <text class="muted" x="790" y="862" font-size="11">nelinearita</text>
  <text class="muted" x="790" y="906" font-size="11">zúž späť</text>

  <path class="arr" d="M200,914 L200,946" marker-end="url(#a)"/>
  <path class="arr" d="M440,914 L440,946" marker-end="url(#a)"/>
  <path class="arr" d="M680,914 L680,946" marker-end="url(#a)"/>

  <!-- Add 2 + vystup -->
  <rect class="op" x="125" y="948" width="630" height="34" rx="7"/>
  <text class="opt" x="440" y="970" text-anchor="middle" font-size="13">Add (reziduum)  →  výstup vrstvy X′ [3 × 4096]  =  vstup ďalšej vrstvy</text>

  <path class="arr" d="M755,965 C870,965 926,950 926,130 C926,112 850,110 760,114" marker-end="url(#a)" stroke-dasharray="6 5"/>
  <text class="muted" x="910" y="540" text-anchor="middle" font-size="12" transform="rotate(-90 910 540)">× 32 vrstiev nad sebou</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
